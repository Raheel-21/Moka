<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moka – Staff & Admin</title>
<style>
:root{--bg:#f5f1ee;--card:#fff;--tx:#2a1a1c;--mut:#7a6a68;--ac:#008c45;--on:#fff;--rd:#b71c2b;--pk:#f59ec2;--bd:#e5dbd6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171212;--card:#241b1b;--tx:#f5ebe8;--mut:#b8a8a5;--ac:#22b86a;--on:#08140d;--rd:#ff7b88;--bd:#3a2d2d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{margin:0;font-size:22px;color:var(--ac);flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,.b{font:inherit;border:1px solid var(--ac);background:none;color:var(--ac);padding:7px 12px;border-radius:8px;cursor:pointer}
button.on,button.p{background:var(--ac);color:var(--on)}button.d{border-color:var(--rd);color:var(--rd)}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
.tag{padding:2px 10px;border-radius:12px;background:var(--pk);color:#5a1230;font-size:13px}
.mut{color:var(--mut);font-size:13px}.err{color:var(--rd)}
.ord{border-inline-start:5px solid var(--rd)}.ord.done,.ord.cancelled{opacity:.55;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.mi{display:grid;grid-template-columns:60px 1fr 1fr 80px;gap:6px;align-items:center}
.mi img{width:60px;height:45px;object-fit:contain;background:var(--bd);border-radius:6px}
.mi .w{grid-column:1/-1}.bar{height:10px;background:var(--ac);border-radius:5px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
.stat{font-size:26px;font-weight:700;color:var(--ac)}
@media(max-width:560px){.mi{grid-template-columns:60px 1fr}}
</style></head><body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>Math.round(n*100)/100+" EGP";
let T=localStorage.tk||"",ROLE=localStorage.role||"",tab="orders",timer;
async function api(p,o={}){const r=await fetch("/api/"+p,{method:o.method||"GET",headers:{"content-type":"application/json",authorization:"Bearer "+T},body:o.body?JSON.stringify(o.body):undefined});
 if(r.status===401&&T){logout();throw"Session expired"}const j=await r.json();if(!r.ok)throw j.error||"Error";return j}
function logout(){localStorage.clear();T="";show()}
function show(){clearInterval(timer);
 if(!T){$("#root").innerHTML=`<main style="max-width:360px"><div class="card"><h1 style="color:var(--ac)">moka · staff</h1><input id="u" placeholder="Username" style="width:100%"><br><br><input id="p" type="password" placeholder="Password" style="width:100%" onkeydown="if(event.key==='Enter')login()"><br><br><button class="p" onclick="login()">Sign in</button><p class="err" id="e"></p></div></main>`;return}
 const tabs=[["orders","Orders"]].concat(ROLE==="admin"?[["menu","Menu"],["reports","Reports"],["staff","Staff"]]:[]);
 $("#root").innerHTML=`<header><h1>moka · ${esc(ROLE)}</h1><nav>${tabs.map(([k,l])=>`<button id="t-${k}" onclick="go('${k}')">${l}</button>`).join("")}<button onclick="logout()">Sign out</button></nav></header><main id="v"></main>`;go(tab)}
async function login(){try{const j=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:$("#u").value,password:$("#p").value})}).then(async r=>{const j=await r.json();if(!r.ok)throw j.error;return j});T=j.token;ROLE=j.role;localStorage.tk=T;localStorage.role=ROLE;tab="orders";show()}catch(e){$("#e").textContent=e||"Error"}}
function go(t){tab=t;clearInterval(timer);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.id==="t-"+t));({orders:vOrders,menu:vMenu,reports:vReports,staff:vStaff})[t]()}
const NEXT={new:["prep","Start preparing"],prep:["ready","Mark ready"],ready:["done","Delivered"]};
const LBL={new:"New",prep:"Preparing",ready:"Ready",done:"Delivered",cancelled:"Cancelled"};
async function vOrders(){
 const draw=async()=>{try{const os=await api("staff/orders"),act=os.filter(o=>["new","prep","ready"].includes(o.status)).reverse(),old=os.filter(o=>!act.includes(o)).slice(0,15);
  const c=o=>`<div class="card ord ${o.status}"><div class="row"><b>Table ${esc(o.tbl)} · ${esc(o.name)}</b><span class="tag">${LBL[o.status]}</span></div><div class="mut">${new Date(o.at).toLocaleTimeString()} · ${esc(o.phone)} · ${esc(o.email)}</div>${o.items.map(i=>`<div>${i.q} × ${esc(i.n)}</div>`).join("")}${o.note?`<div class="mut">📝 ${esc(o.note)}</div>`:""}<div class="row"><span>${o.pay==="cash"?"Cash":"Card"}</span><b>${money(o.total)}</b></div>${NEXT[o.status]?`<div class="row" style="justify-content:flex-start"><button class="p" onclick="setSt('${o.id}','${NEXT[o.status][0]}')">${NEXT[o.status][1]}</button>${o.status==="new"?`<button class="d" onclick="setSt('${o.id}','cancelled')">Cancel</button>`:""}</div>`:""}</div>`;
  const prev=$("#cnt");const n=act.filter(o=>o.status==="new").length;if(prev&&n>+prev.dataset.n)try{new AudioContext().resume().then(()=>{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.25)})}catch{}
  $("#v").innerHTML=`<div id="cnt" data-n="${n}" class="mut">${act.length} active · refreshes every 4s</div><div class="grid">${act.map(c).join("")||'<div class="card mut">No active orders</div>'}</div><h4>Recent</h4><div class="grid">${old.map(c).join("")}</div>`}catch(e){}};
 await draw();timer=setInterval(()=>tab==="orders"&&draw(),4000)}
async function setSt(id,s){await api("staff/orders/"+id,{method:"PATCH",body:{status:s}});vOrders()}
async function vMenu(){
 const items=await api("admin/items");items.unshift({id:0,cat:"",name:"",price:"",descr:"",img:"",active:1});
 $("#v").innerHTML=`<div class="mut">Edit any row and press Save. Row 1 adds a new item. Hidden items do not show to customers.</div>`+items.map(i=>`<div class="card mi" data-id="${i.id}"><img src="${esc(i.img)}" alt=""><input data-k="name" placeholder="Name" value="${esc(i.name)}"><input data-k="cat" placeholder="Category" value="${esc(i.cat)}" list="cats"><input data-k="price" type="number" step="0.5" placeholder="Price" value="${esc(i.price)}">
 <input class="w" data-k="descr" placeholder="Description" value="${esc(i.descr)}"><input class="w" data-k="img" placeholder="Image URL (or upload)" value="${esc(i.img)}">
 <label><input type="checkbox" data-k="active" ${i.active?"checked":""}> Visible</label><label class="b mut">Upload<input type="file" accept="image/*" hidden onchange="upl(this)"></label><button class="p" onclick="saveItem(this)">${i.id?"Save":"Add"}</button>${i.id?`<button class="d" onclick="delItem(${i.id})">Delete</button>`:""}</div>`).join("")+`<datalist id="cats">${[...new Set(items.map(i=>i.cat))].filter(Boolean).map(c=>`<option value="${esc(c)}">`).join("")}</datalist>`}
function upl(f){const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=async()=>{try{const j=await api("admin/upload",{method:"POST",body:{data:r.result}});const row=f.closest(".mi");row.querySelector('[data-k=img]').value=j.url;row.querySelector("img").src=j.url}catch(e){alert(e)}};r.readAsDataURL(file)}
async function saveItem(btn){const row=btn.closest(".mi"),id=+row.dataset.id,b={};row.querySelectorAll("[data-k]").forEach(e=>b[e.dataset.k]=e.type==="checkbox"?e.checked:e.value);
 if(!b.name||!b.cat||b.price===""){alert("Name, category and price are required");return}
 try{await api(id?"admin/items/"+id:"admin/items",{method:id?"PUT":"POST",body:b});vMenu()}catch(e){alert(e)}}
async function delItem(id){if(confirm("Delete this item? (You can hide it instead.)")){await api("admin/items/"+id,{method:"DELETE"});vMenu()}}
async function vReports(){
 const d=new Date(),iso=x=>x.toLocaleDateString("en-CA"),f0=new Date(d-29*864e5);
 $("#v").innerHTML=`<div class="card row" style="justify-content:flex-start">From <input type="date" id="f" value="${iso(f0)}"> To <input type="date" id="t" value="${iso(d)}"><button class="p" onclick="loadRep()">Show</button></div><div id="rep"></div>`;loadRep()}
async function loadRep(){const r=await api(`admin/report?from=${$("#f").value}&to=${$("#t").value}`),mx=Math.max(1,...r.days.map(x=>x.revenue));
 $("#rep").innerHTML=`<div class="grid"><div class="card"><div class="mut">Revenue</div><div class="stat">${money(r.revenue)}</div></div><div class="card"><div class="mut">Orders</div><div class="stat">${r.orders}</div></div><div class="card"><div class="mut">Average order</div><div class="stat">${r.orders?money(r.revenue/r.orders):"–"}</div></div></div>
 <div class="card"><b>By day</b><table>${r.days.map(x=>`<tr><td>${x.d}</td><td>${x.orders} orders</td><td>${money(x.revenue)}</td><td style="width:35%"><div class="bar" style="width:${x.revenue/mx*100}%"></div></td></tr>`).join("")||'<tr><td class="mut">No data</td></tr>'}</table></div>
 <div class="card"><b>Best sellers</b><table><tr><th>Item</th><th>Qty</th><th>Revenue</th></tr>${r.top.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.qty}</td><td>${money(x.revenue)}</td></tr>`).join("")}</table></div>
 <div class="card"><b>Payment methods</b><table>${Object.entries(r.pays).map(([k,v])=>`<tr><td>${k==="cash"?"Cash":"Card"}</td><td>${v.orders} orders</td><td>${money(v.revenue)}</td></tr>`).join("")}</table></div>`}
async function vStaff(){const us=await api("admin/users");
 $("#v").innerHTML=`<div class="card"><b>Add staff account</b><div class="row" style="justify-content:flex-start;margin-top:8px"><input id="nu" placeholder="Username"><input id="np" type="password" placeholder="Password (6+)"><select id="nr"><option value="cashier">Cashier</option><option value="kitchen">Kitchen</option><option value="admin">Admin</option></select><button class="p" onclick="addU()">Add</button></div><div class="err" id="ue"></div></div>
 <div class="card"><table>${us.map(u=>`<tr><td>${esc(u.username)}</td><td>${u.role}</td><td><button class="d" onclick="delU(${u.id})">Delete</button></td></tr>`).join("")}</table></div>`}
async function addU(){try{await api("admin/users",{method:"POST",body:{username:$("#nu").value,password:$("#np").value,role:$("#nr").value}});vStaff()}catch(e){$("#ue").textContent=e}}
async function delU(id){if(confirm("Delete this account?"))try{await api("admin/users",{method:"DELETE",body:{id}});vStaff()}catch(e){alert(e)}}
show();
</script></body></html>
